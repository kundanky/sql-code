name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install --legacy-peer-deps
      - run: npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/local-notifications @capacitor/status-bar @capacitor/splash-screen @capacitor/assets
      - run: npm run build
      - run: npm install --no-save --legacy-peer-deps typescript@5.6.3
        
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      # 1. Generates ALL native Android app icons and native splash screens from your assets/icon.png
      - name: Generate App Icons and Splash
        run: npx @capacitor/assets generate --android

      # 2. Injects YOUR uploaded logo into the pulsing web animation
      - name: Inject Animated Splash into Web Build
        run: |
          HTML_FILE=""
          if [ -f "dist/index.html" ]; then HTML_FILE="dist/index.html"; fi
          if [ -f "www/index.html" ]; then HTML_FILE="www/index.html"; fi
          if [ -f "build/index.html" ]; then HTML_FILE="build/index.html"; fi
          
          if [ -n "$HTML_FILE" ]; then
            # Convert your uploaded icon into a base64 string
            ICON_BASE64=$(base64 -w 0 assets/icon.png)
            
            # The splash HTML uses your base64 image
            SPLASH="<div id=\"gh-splash\" style=\"position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999;display:flex;justify-content:center;align-items:center;transition:opacity 0.5s ease-out;\"><img src=\"data:image/png;base64,$ICON_BASE64\" style=\"width:150px;height:150px;animation:ghPulse 1.5s infinite alternate;\" /></div><style>@keyframes ghPulse{from{transform:scale(0.9);opacity:0.8}to{transform:scale(1.1);opacity:1}}</style><script>window.addEventListener(\"load\",()=>{setTimeout(()=>{const e=document.getElementById(\"gh-splash\");if(e){e.style.opacity=\"0\";setTimeout(()=>e.remove(),500)}},2000)})</script>"
            
            sed -i "s|</body>|$SPLASH</body>|" "$HTML_FILE"
          fi

      - name: Fix status bar and gesture bar overlap
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          PKG=$(grep -m1 '^package ' "$F" | sed 's/package //; s/;//')
          cat > "$F" <<EOF
          package $PKG;

          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().getDecorView().setBackgroundColor(0xFF121212);
              WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView()).setAppearanceLightStatusBars(false);
              View root = findViewById(android.R.id.content);
              ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                v.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                return WindowInsetsCompat.CONSUMED;
              });
            }
          }
          EOF

      - name: Force Native Splash Screen Background to Black
        run: |
          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="splashBackground">#000000</color></resources>' > android/app/src/main/res/values/colors.xml
          sed -i 's|<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">|<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">\n        <item name="windowSplashScreenBackground">@color/splashBackground</item>|' android/app/src/main/res/values/styles.xml

      - name: Add permissions
        run: |
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application|' android/app/src/main/AndroidManifest.xml
      
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
