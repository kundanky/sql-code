# FIXED: Changed file extensions to .cjs
- name: Generate Logo and Splash Assets
  run: |
    cat << 'EOF' > generate-assets.cjs
    const sharp = require('sharp');
    const fs = require('fs');
    if (!fs.existsSync('assets')) fs.mkdirSync('assets');

    const fgSvg = `
    <svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
      <circle cx="512" cy="512" r="350" fill="#FFFFFF" />
      <g transform="translate(512, 512) rotate(45)">
        <rect x="-280" y="-70" width="560" height="140" fill="#000000" rx="5"/>
        <rect x="-70" y="-280" width="140" height="560" fill="#000000" rx="5"/>
      </g>
    </svg>`;
    
    const bgSvg = `<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg"><rect width="1024" height="1024" fill="#000000"/></svg>`;
    
    const splashSvg = `
    <svg width="2732" height="2732" xmlns="http://www.w3.org/2000/svg">
      <rect width="2732" height="2732" fill="#000000"/>
      <circle cx="1366" cy="1366" r="400" fill="#FFFFFF" />
      <g transform="translate(1366, 1366) rotate(45)">
        <rect x="-320" y="-80" width="640" height="160" fill="#000000" rx="5"/>
        <rect x="-80" y="-320" width="160" height="640" fill="#000000" rx="5"/>
      </g>
    </svg>`;

    Promise.all([
      sharp(Buffer.from(fgSvg)).png().toFile('assets/icon-foreground.png'),
      sharp(Buffer.from(bgSvg)).png().toFile('assets/icon-background.png'),
      sharp(Buffer.from(bgSvg)).png().toFile('assets/icon-only.png'),
      sharp(Buffer.from(splashSvg)).png().toFile('assets/splash.png'),
      sharp(Buffer.from(splashSvg)).png().toFile('assets/splash-dark.png')
    ]).then(() => console.log('Assets generated successfully'));
    EOF
    node generate-assets.cjs
    npx @capacitor/assets generate --android

# FIXED: Changed file extensions to .cjs
- name: Inject Animated Splash into Web Build
  run: |
    cat << 'EOF' > inject-splash.cjs
    const fs = require('fs');
    let targetPath = null;
    if (fs.existsSync('./dist/index.html')) targetPath = './dist/index.html';
    else if (fs.existsSync('./www/index.html')) targetPath = './www/index.html';
    else if (fs.existsSync('./build/index.html')) targetPath = './build/index.html';

    if (targetPath) {
      let html = fs.readFileSync(targetPath, 'utf8');
      const splashHtml = `
      <div id="gh-splash" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000000;z-index:99999;display:flex;justify-content:center;align-items:center;transition:opacity 0.5s ease-out;">
        <svg width="200" height="200" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" style="animation: ghPulse 1.5s infinite alternate;">
          <circle cx="512" cy="512" r="350" fill="#FFFFFF" />
          <g transform="translate(512, 512) rotate(45)">
            <rect x="-280" y="-70" width="560" height="140" fill="#000000" rx="5"/>
            <rect x="-70" y="-280" width="140" height="560" fill="#000000" rx="5"/>
          </g>
        </svg>
      </div>
      <style>@keyframes ghPulse { from { transform: scale(0.9); opacity: 0.8; } to { transform: scale(1.1); opacity: 1; } }</style>
      <script>
        window.addEventListener('load', () => {
          setTimeout(() => {
            const el = document.getElementById('gh-splash');
            if (el) { el.style.opacity = '0'; setTimeout(() => el.remove(), 500); }
          }, 2000);
        });
      </script>
      `;
      html = html.replace(/<body[^>]*>/, match => match + splashHtml);
      fs.writeFileSync(targetPath, html);
      console.log('Splash animation injected successfully into', targetPath);
    } else {
      console.log('Could not find index.html');
    }
    EOF
    node inject-splash.cjs
